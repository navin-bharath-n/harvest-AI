<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynamic Video Outro</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#080e19;color:white;font-family:Arial,sans-serif}#outro{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(circle at 75% 18%,#e9a657 0%,#644b57 19%,#16253b 48%,#07111c 83%)}#outro:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(4,10,20,.2) 25%,rgba(4,10,20,.85) 70%,#050b15 100%)}.sun{position:absolute;top:255px;right:140px;width:210px;height:210px;background:#ffe9a7;border-radius:50%;filter:blur(20px);opacity:.8}.cross{position:absolute;right:125px;top:180px;width:34px;height:420px;background:#261b19;transform:rotate(2deg);box-shadow:0 0 30px #e9ac56}.cross:after{content:'';position:absolute;width:240px;height:33px;top:95px;left:-105px;background:#261b19}.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:135px 78px 100px}.brand{font-family:Georgia,serif;font-style:italic;font-size:76px;letter-spacing:-2px;text-shadow:0 3px 15px #111}.brand span{color:#ffcb68}.subbrand{font-size:21px;letter-spacing:7px;margin-top:17px}.headline{margin-top:190px;font-family:Georgia,serif;font-style:italic;font-size:78px;line-height:1.1;text-shadow:0 4px 16px #000}.headline strong{display:block;font-size:130px;color:#ffd06b;font-weight:normal}.tagline{font-size:26px;letter-spacing:6px;margin-top:55px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;margin-top:72px}.action{border:2px solid var(--edge);background:var(--bg);border-radius:24px;padding:28px 24px;display:flex;align-items:center;gap:20px;font-weight:bold;font-size:34px;text-align:left}.action b{font-size:43px}.panel{width:100%;border:2px solid #d7aa68;border-radius:32px;background:rgba(8,16,30,.83);margin-top:70px;padding:36px;display:flex;align-items:center;gap:35px}.qr{width:275px;height:275px;background:white;padding:12px;border-radius:16px;flex-shrink:0}.qr img{width:100%;height:100%}.qrtext{font-size:27px;text-align:left;line-height:1.4}.qrtext strong{display:block;color:#ffd277;font-size:30px;margin-bottom:10px}.url{font-size:23px;margin-top:25px}.footer{margin-top:auto;font-family:Georgia,serif;font-style:italic;font-size:49px;color:#fff1d6}.small{font-family:Arial,sans-serif;font-size:20px;letter-spacing:3px;margin-top:30px;color:#ddd}@keyframes enter{from{opacity:0;transform:translateY(45px)}to{opacity:1;transform:translateY(0)}}.brand,.subbrand,.headline,.tagline,.actions,.panel,.footer{animation:enter .8s ease both}.headline{animation-delay:.4s}.tagline{animation-delay:.8s}.actions{animation-delay:1.3s}.panel{animation-delay:2s}.footer{animation-delay:2.6s}@media(max-width:1080px){#outro{transform-origin:top left;transform:scale(calc(100vw / 1080));}body{height:calc(100vw * 1920 / 1080);overflow:hidden}}
</style></head><body><div id="outro"><div class="sun"></div><div class="cross"></div><div class="content"><div class="brand" id="brand">DailyWhisper<span>365</span></div><div class="subbrand" id="subbrand">A DAILY PRAYER FOR A BRIGHTER TOMORROW</div><div class="headline">Thanks for<strong>Watching</strong></div><div class="tagline" id="tagline">STAY CONNECTED • STAY BLESSED</div><div class="actions"><div class="action" style="--edge:#3895ff;--bg:#073d85"><b>👍</b> LIKE</div><div class="action" style="--edge:#42d68a;--bg:#075638"><b>💬</b> COMMENT</div><div class="action" style="--edge:#f45358;--bg:#781722"><b>🔔</b> SUBSCRIBE</div><div class="action" style="--edge:#ed6abf;--bg:#642048"><b>♥</b> FOLLOW</div></div><div class="panel"><div class="qr"><img id="qr" alt="Channel QR code"></div><div class="qrtext"><strong>SCAN & CONNECT</strong>Watch more prayers, songs and uplifting messages.<div class="url" id="url">youtube.com/@DailyWhisper365</div></div></div><div class="footer" id="footer">To God Be the Glory</div><div class="small">PRAY DAILY • GROW IN FAITH • SHARE LOVE</div></div></div><script>
const defaults={brand:'DailyWhisper',brandAccent:'365',subbrand:'A DAILY PRAYER FOR A BRIGHTER TOMORROW',tagline:'STAY CONNECTED • STAY BLESSED',url:'https://www.youtube.com/@DailyWhisper365',footer:'To God Be the Glory'};
function applyOutroConfig(config={}){const c={...defaults,...config};document.getElementById('brand').innerHTML='';document.getElementById('brand').append(document.createTextNode(c.brand));const span=document.createElement('span');span.textContent=c.brandAccent;document.getElementById('brand').append(span);for(const id of ['subbrand','tagline','footer'])document.getElementById(id).textContent=c[id];document.getElementById('url').textContent=c.url.replace(/^https?:\/\//,'');document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(c.url)}
applyOutroConfig(window.OUTRO_CONFIG||{});
</script></body></html>
